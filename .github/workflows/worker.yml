name: Deploy calendar Worker to Cloudflare

on:
  push:
    branches: [main]
    paths: ['worker/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skips cleanly until CI deploys are enabled (repo variable CF_WORKER_CI = true
    # plus secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID).
    if: ${{ vars.CF_WORKER_CI == 'true' }}
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
