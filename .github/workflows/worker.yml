name: Deploy calendar Worker to Cloudflare

on:
  push:
    branches: [main]
    paths: ['worker/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skips cleanly until Cloudflare is set up (secrets/variables missing).
    if: ${{ vars.CF_KV_NAMESPACE_ID != '' }}
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - name: Inject KV namespace id
        run: sed -i "s/__KV_NAMESPACE_ID__/${{ vars.CF_KV_NAMESPACE_ID }}/" wrangler.toml
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
